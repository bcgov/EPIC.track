            - name: bpm-ca-certs
              mountPath: /ca-certs
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -e
                    if [ -d /ca-certs ]; then
                      for cert in /ca-certs/*.crt; do
                        if [ -f "$cert" ]; then
                          echo "Importing certificate: $cert"
                          keytool -import -trustcacerts -alias $(basename "$cert" .crt) -file "$cert" -keystore $JAVA_HOME/lib/security/cacerts -storepass changeit -noprompt || true
                        fi
                      done
                    fi
                    echo "Certificate import completed"
