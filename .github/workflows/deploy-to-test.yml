name: Deploy to Test

on:
  workflow_dispatch:
    inputs:
      component:
        description: "What to promote"
        required: true
        default: both
        type: choice
        options:
          - both
          - api
          - web

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  deployment:
    runs-on: ubuntu-24.04
    environment:
      name: test
    steps:
      - uses: actions/checkout@v6

      - name: Choose components
        id: components
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          case "$COMPONENT" in
            both) echo "apps=api web" >> "$GITHUB_OUTPUT" ;;
            api|web) echo "apps=$COMPONENT" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown component: $COMPONENT"; exit 1 ;;
          esac

      - name: Install OpenShift CLI
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Login Openshift
        shell: bash
        run: |
          oc login --server=${{secrets.OPENSHIFT_LOGIN_REGISTRY}} --token=${{secrets.OPENSHIFT_SA_TOKEN}}

      - name: Tag Images and Rollout
        shell: bash
        env:
          APPS: ${{ steps.components.outputs.apps }}
        run: |
          oc project ${{ secrets.OPENSHIFT_REPOSITORY }}-tools
          for app in $APPS; do
            oc tag epictrack-$app:latest epictrack-$app:test
          done

          for app in $APPS; do
            oc rollout restart deployment/epictrack-$app -n ${{ secrets.OPENSHIFT_REPOSITORY }}-test
          done
          for app in $APPS; do
            oc rollout status deployment/epictrack-$app -n ${{ secrets.OPENSHIFT_REPOSITORY }}-test --timeout=5m
          done

  update_event_templates:
    needs: deployment
    if: inputs.component != 'web'
    uses: ./.github/workflows/deploy-event-templates.yml
    with:
      environment: "test"
    secrets: inherit
